
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator biegu</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#101820">
  <link rel="apple-touch-icon" href="icon-192.png">

  
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 400px;
    margin: 0 auto;
    padding: 24px 20px;
    background-color: #101820;
    color: #ffffff;
  }

  /* Nagłówek aplikacji */

  .app-header {
    margin-bottom: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .brand-icon {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    background-color: #c9ff45;
    color: #101820;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-icon svg {
    width: 30px;
    height: 30px;
  }

  .brand-text h1 {
    font-size: 26px;
    margin: 0;
    text-align: left;
    letter-spacing: 0.5px;
  }

  .brand-text p {
    font-size: 11px;
    color: #9da9b5;
    margin: 4px 0 0;
    letter-spacing: 0.5px;
  }

  .header-divider {
    height: 1px;
    background-color: #34414b;
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 12px;
    color: #b7c2cb;
    letter-spacing: 1px;
    margin: 0 0 8px;
  }

  .app-header h2 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  div {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 18px;
    font-size: 24px;
    font-weight: 450;
    box-sizing: border-box;
    border: 1px solid #34414b;
    border-radius: 12px;
    background-color: #202d38;
    color: #ffffff;
  }

  input:focus {
    outline: none;
    border-color: #c9ff45;
    box-shadow: 0 0 0 2px rgba(201, 255, 69, 0.15);
  }

  input.result {
    background-color: #263629;
    border-color: #c9ff45;
    color: #c9ff45;
    font-weight: 520;
  }

  input::placeholder {
    color: #82919e;
    font-weight: 400;
  }

  button {
    width: 100%;
    padding: 18px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  button:active{
    transform: scale(0.98);
  }

  button:first-of-type {
    background-color: #c9ff45;
    color: #101820;
    font-weight: bold;
  }

  button:last-of-type {
    background-color: #202d38;
    color: #b7c2cb;
    border: 1px solid #34414b;
  }

  @media (max-width: 480px) {
    body {
      padding: 20px 16px;
    }

    .brand-text h1 {
      font-size: 24px;
    }
  }

  .app-header .brand-icon,
  .app-header .brand-text,
  .app-header .header-divider {
    margin-bottom: 0;
  }
</style>

</head>

<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>

      <div class="brand-text">
        <h1>RUN CALC</h1>
        <p>TWÓJ KALKULATOR BIEGOWY</p>
      </div>
    </div>

  <div class="header-divider"></div>

  <p class="section-label">OBLICZ SWÓJ BIEG</p>
  <h2>Każde tempo ma znaczenie.</h2>
</header>

  <div>
    <label for="pace">Tempo (min/km)</label>
    <input
      id="pace"
      type="text"
      inputmode="numeric"
      placeholder="np. 5:30"
      maxlength="5"
      oninput="clearPreviousResult('pace')"
      onblur="formatPaceInput(this)"
    >
  </div>

  <div>
    <label for="distance">Dystans (km)</label>
    <input
      id="distance"
      type="text"
      inputmode="decimal"
      placeholder="np. 10"
      oninput="limitDistanceDecimals(this); clearPreviousResult('distance')"
    >
  </div>

  <div>
    <label for="time">Czas</label>
    <input
      id="time"
      type="text"
      inputmode="numeric"
      placeholder="np. 5500 lub 10530"
      oninput="clearPreviousResult('time')"
      onblur="formatTimeInput(this)"
    >
  </div>

  <button onclick="calculate()">Oblicz</button>
  <button onclick="clearFields()">Wyczyść</button>

  <script>
    // Zapamiętujemy, które pole zawiera ostatni wynik
    let resultField = null;

    function highlightResult(fieldId) {
      document.querySelectorAll("input").forEach(function(input) {
        input.classList.remove("result");
      });

      document.getElementById(fieldId).classList.add("result");
    }

    // Usuwamy poprzedni wynik po zmianie danych wejściowych
    function clearPreviousResult(changedField) {
      if (resultField !== null && changedField !== resultField) {
        document.getElementById(resultField).value = "";
        resultField = null;
      }

      if (changedField === resultField) {
        resultField = null;
      }

      document.querySelectorAll("input").forEach(function(input) {
        input.classList.remove("result");
      });
    }

    // Ograniczamy dystans do dwóch miejsc po przecinku
    function limitDistanceDecimals(input) {
      let value = input.value.replace(",", ".");

      if (!/^\d*\.?\d{0,2}$/.test(value)) {
        value = value.slice(0, -1);
      }

      input.value = value;
    }

    // Czyścimy wszystkie pola i zapamiętany wynik
    function clearFields() {
      document.getElementById("pace").value = "";
      document.getElementById("distance").value = "";
      document.getElementById("time").value = "";

      resultField = null;
      document.querySelectorAll("input").forEach(function(input) {
        input.classList.remove("result");
      });
    }

    // Zamieniamy sekundy na min:sek lub godz:min:sek
    function formatTime(totalSeconds) {
      totalSeconds = Math.round(totalSeconds);

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (hours > 0) {
        return hours + ":" +
          String(minutes).padStart(2, "0") + ":" +
          String(seconds).padStart(2, "0");
      }

      return minutes + ":" + String(seconds).padStart(2, "0");
    }

    function formatPaceInput(input) {
      const value = input.value.trim();

    // Jeżeli użytkownik wpisał dwukropek, nic nie zmieniamy
      if (value.includes(":")) {
        return;
      }

    // Akceptujemy tylko 3 lub 4 cyfry
      if (!/^\d{3,4}$/.test(value)) {
        return;
      }

      // Ostatnie dwie cyfry traktujemy jako sekundy
      const minutes = value.slice(0, -2);
      const seconds = value.slice(-2);

      input.value = Number(minutes) + ":" + seconds;
    }

    function formatTimeInput(input) {
      const value = input.value.trim();

      // Jeśli czas ma już dwukropek, nic nie zmieniamy
      if (value.includes(":")) {
        return;
      }

      // Akceptujemy od 3 do 6 cyfr
      if (!/^\d{3,6}$/.test(value)) {
        return;
      }

      const seconds = value.slice(-2);
      const minutes = value.slice(-4, -2);
      const hours = value.slice(0, -4);

      if (hours !== "") {
        input.value = Number(hours) + ":" +
          minutes + ":" + seconds;
      } else {
        input.value = Number(minutes) + ":" + seconds;
      }
    }

    // Główna funkcja kalkulatora
    function calculate() {
      formatPaceInput(document.getElementById("pace"));
      formatTimeInput(document.getElementById("time"));

      const pace = document.getElementById("pace").value.trim();
      const distance = document.getElementById("distance").value.trim();
      const time = document.getElementById("time").value.trim();

      const filledFields = [pace, distance, time]
        .filter(value => value !== "").length;

      if (filledFields !== 2) {
        alert("Wpisz dokładnie dwa z trzech parametrów.");
        return;
      }

      let paceInSeconds = null;
      let distanceNumber = null;
      let timeInSeconds = null;

      // Walidacja tempa
      if (pace !== "") {
        if (!/^\d{1,2}:[0-5]\d$/.test(pace)) {
          alert("Wpisz tempo w formacie min:sek, np. 5:30");
          return;
        }

        const parts = pace.split(":");
        const minutes = Number(parts[0]);
        const seconds = Number(parts[1]);

        paceInSeconds = minutes * 60 + seconds;

        if (paceInSeconds < 150 || paceInSeconds > 900) {
          alert("Tempo musi mieścić się w zakresie 2:30–15:00 min/km.");
          return;
        }
      }

      // Walidacja dystansu
      if (distance !== "") {
        if (!/^\d+(\.\d{1,2})?$/.test(distance)) {
          alert("Wpisz dystans z maksymalnie dwoma miejscami po przecinku.");
          return;
        }

        distanceNumber = Number(distance);

        if (distanceNumber < 0.05 || distanceNumber > 100) {
          alert("Dystans musi mieścić się w zakresie 0,05–100 km.");
          return;
        }
      }

      // Walidacja czasu
      if (time !== "") {
        if (!/^(\d+:[0-5]\d|\d+:[0-5]\d:[0-5]\d)$/.test(time)) {
          alert("Wpisz czas w formacie min:sek lub godz:min:sek, np. 55:00 albo 1:05:30");
          return;
        }

        const parts = time.split(":");

        if (parts.length === 2) {
          const minutes = Number(parts[0]);
          const seconds = Number(parts[1]);

          timeInSeconds = minutes * 60 + seconds;
        }

        if (parts.length === 3) {
          const hours = Number(parts[0]);
          const minutes = Number(parts[1]);
          const seconds = Number(parts[2]);

          timeInSeconds = hours * 3600 + minutes * 60 + seconds;
        }

        if (timeInSeconds <= 0 || timeInSeconds > 36000) {
          alert("Czas musi być większy od zera i nie może przekraczać 10 godzin.");
          return;
        }
      }

      // Tempo + dystans = czas
      if (pace !== "" && distance !== "") {
        const totalSeconds = paceInSeconds * distanceNumber;

        if (totalSeconds > 36000) {
          alert("Obliczony czas przekracza 10 godzin.");
          return;
        }

        document.getElementById("time").value = formatTime(totalSeconds);
        resultField = "time";
        highlightResult("time");
      }

      // Dystans + czas = tempo
      if (distance !== "" && time !== "") {
        const resultPaceSeconds = Math.round(timeInSeconds / distanceNumber);

        if (resultPaceSeconds < 150 || resultPaceSeconds > 900) {
          alert("Obliczone tempo jest poza zakresem 2:30–15:00 min/km.");
          return;
        }

        const resultMinutes = Math.floor(resultPaceSeconds / 60);
        const resultSeconds = resultPaceSeconds % 60;

        document.getElementById("pace").value =
          resultMinutes + ":" + String(resultSeconds).padStart(2, "0");

        resultField = "pace";
        highlightResult("pace");
      }

      // Tempo + czas = dystans
      if (pace !== "" && time !== "") {
        const resultDistance = timeInSeconds / paceInSeconds;

        if (resultDistance < 0.05 || resultDistance > 100) {
          alert("Obliczony dystans jest poza zakresem 0,05–100 km.");
          return;
        }

        document.getElementById("distance").value =
          resultDistance.toFixed(2);

        resultField = "distance";
        highlightResult("distance");
      }
    }

    // Enter uruchamia obliczenia
    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();

        formatPaceInput(document.getElementById("pace"));
        formatTimeInput(document.getElementById("time"));

        calculate();
      }
    });

    
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("./service-worker.js")
        .then(function() {
          console.log("Service Worker zarejestrowany");
        })
        .catch(function(error) {
          console.log("Błąd Service Workera:", error);
        });
    });
  }

  </script>

</body>
</html>
